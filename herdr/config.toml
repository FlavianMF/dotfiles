# Herdr configuration
# Linked from ~/dotfiles/herdr/config.toml to ~/.config/herdr/config.toml

# Set to false to bypass initial setup prompts
onboarding = false

[theme]
# Matches the Catppuccin Mocha theme used across tmux and yazi in ~/dotfiles
name = "catppuccin"
auto_switch = false

[terminal]
# Matches default-shell from ~/dotfiles/tmux/.tmux.conf
default_shell = "/usr/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"
kitty_graphics = true

[keys]
# Tmux-compatible prefix key (tmux: set -g prefix C-Space)
prefix = "ctrl+space"
extra_prefixes = ["ctrl+b"]

# Tmux-compatible reload config (tmux: bind r source-file ~/.tmux.conf)
reload_config = "prefix+r"

# Window / Tab management (tmux: c, n, p, 1..9, &)
# Includes Alt+Shift+Left/Right and Ctrl+Shift+Left/Right for repeatable tab switching without prefix
new_tab = "prefix+c"
next_tab = ["prefix+n", "alt+shift+right", "ctrl+shift+right"]
previous_tab = ["prefix+p", "alt+shift+left", "ctrl+shift+left"]
switch_tab = "prefix+1..9"
close_tab = ["prefix+shift+x", "prefix+ampersand"]

# Pane splits (vertical split right, horizontal split down)
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# Vim navigation between panes (tmux: h, j, k, l)
# Includes Alt+h/j/k/l and Ctrl+h/j/k/l for fast direct pane navigation outside Neovim
focus_pane_left = ["prefix+h", "alt+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "alt+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "alt+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "alt+l", "ctrl+l"]
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Pane resizing with vim motions (tmux: bind -r H/J/K/L resize-pane 5)
# resize_mode enables modal repeatable resizing (h/j/k/l repeatedly until Esc/Enter)
# Direct chords (Alt+Shift+H/J/K/L) allow rapid repeating without prefix
resize_mode = "prefix+shift+r"
resize_pane_left = ["prefix+shift+h", "alt+shift+h", "ctrl+shift+h", "ctrl+shift+alt+left"]
resize_pane_down = ["prefix+shift+j", "alt+shift+j", "ctrl+shift+j", "ctrl+shift+alt+down"]
resize_pane_up = ["prefix+shift+k", "alt+shift+k", "ctrl+shift+k", "ctrl+shift+alt+up"]
resize_pane_right = ["prefix+shift+l", "alt+shift+l", "ctrl+shift+l", "ctrl+shift+alt+right"]

# Vi Copy mode & Scrollback (tmux: prefix+[ and vi mode)
copy_mode = "prefix+["
edit_scrollback = "prefix+e"

# Pane controls (tmux: z for zoom, x for kill-pane)
zoom = "prefix+z"
close_pane = "prefix+x"

# Detach session (tmux: prefix+d; also keep prefix+q)
detach = ["prefix+d", "prefix+q"]

# Navigate-mode movements (vim-style)
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Agent cycling shortcuts
previous_agent = "f7"
next_agent = "f8"

# 3-column layout shortcuts (tmux: prefix+T and prefix+E via layout-3col.sh)
[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "$HOME/.config/herdr/scripts/layout-3col.sh new"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "$HOME/.config/herdr/scripts/layout-3col.sh apply"

[ui]
# Sort agents by priority (blocked -> working -> done -> idle)
agent_panel_sort = "priority"
window_title = "herdr · {terminal_title}"
copy_on_select = true
mouse_scroll_lines = 3

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sidebar.agents]
rows = [
    ["state_icon", "workspace"],
    ["agent", "terminal_title_stripped"],
]

[update]
channel = "stable"
