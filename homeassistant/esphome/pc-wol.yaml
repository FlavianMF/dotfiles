esphome:
  name: pc-wol
  friendly_name: "LOQ PC Wake-on-LAN"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Conexão WiFi via secrets para evitar credenciais no repositório
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Ponto de acesso de contingência caso a conexão WiFi caia
  ap:
    ssid: "PC-WoL Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Botão exposto nativamente no Home Assistant para enviar Magic Packet ao LOQ
button:
  - platform: wake_on_lan
    name: "Wake LOQ PC"
    id: wake_loq_pc
    target_mac_address: "48:E1:50:C9:1C:C9"
    icon: "mdi:power"
