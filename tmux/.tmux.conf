# ===== Basic Configuration =====
unbind r
bind r source-file ~/.tmux.conf
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
set -g mouse on
set-option -g status-position top

# Terminal and colors
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"
set-option -g focus-events on

# ===== Vim Motions & Navigation with Vim Integration =====
# Smart pane navigation with vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|nvim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Resize panes
bind -r 'H' resize-pane -L 5
bind -r 'J' resize-pane -D 5
bind -r 'K' resize-pane -U 5
bind -r 'L' resize-pane -R 5

# Window navigation
bind -r 'n' next-window
bind -r 'p' previous-window

# Enable vi-style keys in copy mode
set-window-option -g mode-keys vi

# Bind 'v' to begin selection (character-wise)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'V' to begin line-wise selection
bind-key -T copy-mode-vi V send-keys -X select-line

# Bind 'C-v' to begin block-wise selection
bind-key -T copy-mode-vi C-v send-keys -X select-block

# Bind 'y' to yank (copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux show-buffer | cat"

# Bind Enter to copy and cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "tmux show-buffer | cat"

# Copy mode navigation
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-h' select-pane -L

set -g @vim_navigator_mapping_prev ""
bind-key -T copy-mode-vi 'C-\' select-pane -l

unbind-key 'C-]'
unbind-key ']'

# Paste
unbind p
bind p paste-buffer

# Pane management
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.0

# ===== Plugins List =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux'

# ===== Catppuccin Configuration =====
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# ===== Status Line Configuration =====
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Status left
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status right
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# ===== Pane Border Configuration =====
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# ===== Window Configuration =====
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# ===== ZSH Integration =====
# Set default shell to zsh
set -g default-shell /usr/bin/zsh

# Improve performance with zsh
set -g escape-time 0

# ===== History and Scrollback =====
set -g history-limit 50000

# ===== Session Management =====
set -g detach-on-destroy off
set -g renumber-windows on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable tmux to change the system clipboard using OSC 52
set -s set-clipboard on

# Force tmux-yank to use OSC 52 escape sequences instead of local tools
set -g @yank_selection_mouse 'clipboard'

# ===== Initialize TPM (keep at the bottom!) =====
run '~/.tmux/plugins/tpm/tpm'
