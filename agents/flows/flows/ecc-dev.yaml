# Fluxo piloto ecc-dev (plano v1, seção 3).
# Modelo, esforço e perfil são ponto de partida: troque aqui sem mexer no motor.
# `${slug}` vem do parâmetro de entrada do run. As ligações saem de inputs e outputs.
name: ecc-dev
run_inputs: []

nodes:
  - id: prd
    title: PRD do trabalho
    mode: manual # roda na sua sessão com /prp-prd; o motor espera o arquivo e a aprovação
    agent: {harness: claude, profile: ambient, model: sonnet, effort: high, skills: []}
    prompt: prompts/prp-prd.md
    inputs: []
    outputs: [".claude/PRPs/prds/${slug}.prd.md"]
    gate: human
    when: null
    context: pack
    on_fail: {retry: 0, then: abort}

  - id: plan
    title: Plano de implementação
    agent: {harness: claude, profile: ambient, model: sonnet, effort: medium, skills: []}
    prompt: prompts/prp-plan.md
    inputs: [".claude/PRPs/prds/${slug}.prd.md"]
    outputs: [".claude/PRPs/plans/${slug}.plan.md"]
    gate: human
    when: null
    context: pack
    on_fail: {retry: 1, then: ask_before_upgrade}

  - id: implement
    title: Implementação com testes
    agent: {harness: claude, profile: ambient, model: sonnet, effort: high, skills: []}
    prompt: prompts/prp-implement.md
    inputs: [".claude/PRPs/plans/${slug}.plan.md"]
    outputs: [".claude/PRPs/reports/${slug}-report.md"] # o código vai para o repo; o relatório prova o fim
    gate: none # os testes são o portão
    when: null
    context: pack
    on_fail: {retry: 1, then: ask_before_upgrade}

  - id: review
    title: Revisão a frio
    agent: {harness: antigravity, profile: ambient, model: claude-opus-5.5, effort: high, skills: []}
    prompt: prompts/prp-review.md
    inputs: [".claude/PRPs/reports/${slug}-report.md"]
    outputs: [".claude/PRPs/reviews/${slug}-review.md"] # lista de achados
    gate: none
    when: "diff_lines > 150 or sensitive"
    context: pack # revisão sempre a frio: nunca fork
    on_fail: {retry: 1, then: ask_before_upgrade}

  - id: commit
    title: Commit local
    agent: {harness: claude, profile: ambient, model: haiku, effort: low, skills: []}
    prompt: prompts/prp-commit.md
    inputs: [".claude/PRPs/reports/${slug}-report.md"]
    outputs: [".claude/PRPs/reports/${slug}-commit.md"] # recibo com o hash do commit
    gate: none
    when: null
    context: pack
    on_fail: {retry: 1, then: ask_before_upgrade}

  - id: pr
    title: Pull request
    agent: {harness: claude, profile: ambient, model: haiku, effort: low, skills: []}
    prompt: prompts/prp-pr.md
    inputs: [".claude/PRPs/reports/${slug}-commit.md"]
    outputs: [".claude/PRPs/reports/${slug}-pr.md"] # URL do PR
    gate: human # você aprova antes de abrir
    when: null
    context: pack
    on_fail: {retry: 1, then: ask_before_upgrade}
