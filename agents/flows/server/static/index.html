<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="flow-token" content="__TOKEN__">
<title>Fluxos de agentes</title>
<style nonce="__NONCE__">
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 60rem; padding: 1rem; }
  form, .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #8884; vertical-align: top; }
  .state { font-weight: 600; }
  .warn { color: #b45309; font-weight: 600; }
  .reason { opacity: .75; font-size: .85em; }
  .missing { opacity: .6; }
  #error { color: #b91c1c; min-height: 1.2em; }
  button, input { font: inherit; padding: .3rem .6rem; }
</style>
</head>
<body>
<h1>Fluxos de agentes</h1>
<form id="start">
  <label>Slug <input id="slug" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,63}" placeholder="minha-feature"></label>
  <label><input id="sensitive" type="checkbox"> Mudança sensível</label>
  <button type="submit">Rodar</button>
</form>
<p id="error" role="alert"></p>
<p id="summary"></p>
<p id="repo" class="reason"></p>
<table>
  <thead><tr><th>Fase</th><th>Estado</th><th>Arquivo de saída</th><th>Aviso</th><th>Ação</th></tr></thead>
  <tbody id="phases"></tbody>
</table>
<script nonce="__NONCE__">
"use strict";
const TOKEN = document.querySelector('meta[name="flow-token"]').content;
const $ = (id) => document.getElementById(id);
let runId = null;
try { runId = localStorage.getItem("flow-run-id"); } catch (e) { /* sem armazenamento: a página segue */ }

function show(message) { $("error").textContent = message || ""; }

async function call(method, path, body) {
  const headers = { "X-Flow-Token": TOKEN };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let data = null;
  try { data = await response.json(); } catch (e) { /* corpo vazio */ }
  if (!response.ok) {
    const detail = data && data.detail;
    throw new Error(typeof detail === "string" ? detail : "erro " + response.status);
  }
  return data;
}

function cell(row, ...children) {
  const td = document.createElement("td");
  td.append(...children);
  row.append(td);
  return td;
}

function text(tag, value, className) {
  const el = document.createElement(tag);
  el.textContent = value;
  if (className) el.className = className;
  return el;
}

function actionButtons(node) {
  const box = document.createElement("div");
  box.className = "row";
  if (node.actions.includes("approve")) {
    const button = text("button", "Aprovar parada");
    button.addEventListener("click", () => act(() => call("POST", `/runs/${runId}/gates/${node.id}/approve`)));
    box.append(button);
  }
  if (node.actions.includes("upgrade")) {
    const model = document.createElement("input");
    model.value = "opus";
    model.size = 10;
    model.setAttribute("aria-label", "Modelo de " + node.id);
    const button = text("button", "Escolher modelo");
    button.addEventListener("click", () => act(() => call("POST", `/runs/${runId}/upgrade`, { node: node.id, model: model.value.trim() })));
    box.append(model, button);
  }
  return box;
}

function render(view) {
  $("summary").textContent = `Run ${view.run_id} (${view.status})`;
  $("repo").textContent = `Repo do run: ${view.repo}`;
  const body = $("phases");
  body.replaceChildren();
  for (const node of view.nodes) {
    const row = document.createElement("tr");
    const phase = cell(row, text("div", node.title));
    phase.append(text("div", node.id, "reason"));
    const state = cell(row, text("div", node.state, "state"));
    if (node.reason) state.append(text("div", node.reason, "reason"));
    if (node.child) {
      state.append(text("div", "Sessão: " + (node.child.title || "sem título"), "reason"));
      state.append(text("div", "Filho: " + node.child.id + (node.child.active ? "" : " (encerrado)"), "reason"));
    }
    const outputs = cell(row);
    for (const out of node.outputs) outputs.append(text("div", out.absolute + (out.exists ? "" : " (ainda não existe)"), out.exists ? "" : "missing"));
    cell(row, node.quota_warning ? text("span", node.quota_warning, "warn") : "");
    cell(row, actionButtons(node));
    body.append(row);
  }
}

async function refresh() {
  if (!runId) return;
  try { render(await call("GET", `/runs/${runId}`)); show(""); } catch (e) { show(e.message); }
}

async function act(fn) {
  try { render(await fn()); show(""); } catch (e) { show(e.message); }
}

$("start").addEventListener("submit", async (event) => {
  event.preventDefault();
  try {
    const data = await call("POST", "/runs", { slug: $("slug").value.trim(), sensitive: $("sensitive").checked });
    runId = data.run_id;
    try { localStorage.setItem("flow-run-id", runId); } catch (e) { /* ignora */ }
    show("");
    await refresh();
  } catch (e) { show(e.message); }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
