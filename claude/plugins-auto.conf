# Configuração do `claude/plugins-project.sh auto` (camada de carga do router de tokens).
#
# Cada linha `plugin@marketplace=tipos` mantém o plugin ligado só em projetos desses tipos; nos
# demais o auto grava `false` em <projeto>/.claude/settings.local.json. Tipos (claude/ecc-detect.sh):
# web, node, c, none (qualquer outro). O plugin precisa estar ligado em claude/settings.json.
# Custo de cada plugin (F0a, tokens sempre carregados): figma ~2,1 mil, caveman ~1,8 mil,
# mattpocock-skills ~1,6 mil, impeccable ~0,5 mil, typesafe ~0,2 mil.
#
# Opt-out por projeto: `touch .claude/plugins.off` (o auto não mexe mais) ou apagar a chave do
# plugin do settings.local.json e criar o marcador.
figma@claude-plugins-official=web
# impeccable@impeccable=web
