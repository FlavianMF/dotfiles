# Configuração do `claude/ecc-project.sh auto` (ECC automático por tipo de projeto).
#
# kinds:   tipos que ligam o ECC sozinhos. Valores: web, c, node. Padrão: web,c,node.
# exclude: globs de caminho (separados por vírgula) onde o auto nunca liga. ~ é expandido.
# include: se preenchido, o auto só liga em caminhos que casem com um destes globs.
#
# Opt-out por projeto: `make ecc-off DIR=...` ou `touch .claude/ecc.off` na raiz do repositório.
kinds=web,c,node
# exclude=~/scratch/*,~/tmp/*
# include=~/projetos*/*
