# Configuração do `claude/skills-project.sh auto` (camada de carga das skills soltas).
#
# Cada linha `skill=tipos` mantém a skill fora de ~/.claude/skills (global) e a liga por link em
# <projeto>/.claude/skills/<skill> só nos projetos desses tipos. Tipos (claude/ecc-detect.sh):
# web, node, c, none. A skill precisa existir em ~/.agents/skills. Custo medido (F0a, estimativa):
# ~2,1 mil tokens por turno para este bloco inteiro quando global.
#
# Tipo `manual`: o auto nunca liga. Use `claude/skills-project.sh add <skill> [dir]`.
#
# Opt-out por projeto: `touch .claude/skills.off`.
